<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Check-in — ProsthCU Clinic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0e1f1c;
    --surface: #16302b;
    --surface-2: #1e3a33;
    --mint: #4fe3b0;
    --coral: #f0785a;
    --text: #f3f7f4;
    --text-muted: #8ca69e;
    --line: rgba(243, 247, 244, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 3vh 4vw;
  }

  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .eyebrow {
    font-size: clamp(14px, 1.6vw, 20px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }

  .clock {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(16px, 1.8vw, 22px);
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3vh;
  }

  .headline {
    text-align: center;
    font-size: clamp(20px, 2.6vw, 32px);
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }

  .headline span {
    color: var(--mint);
  }

  .gauge-wrap {
    position: relative;
    width: min(46vh, 42vw);
    height: min(46vh, 42vw);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gauge-wrap.expired svg circle.arc {
    stroke: var(--coral) !important;
  }

  .qr-card {
    position: relative;
    width: 62%;
    height: 62%;
    background: #f3f7f4;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4%;
    transition: transform 0.3s ease;
    box-shadow: 0 0 0 1px var(--line);
  }

  .qr-card.pulse {
    animation: pulse 0.5s ease;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    35% { transform: scale(1.035); }
    100% { transform: scale(1); }
  }

  #qrcode {
    width: 100%;
    height: 100%;
  }

  #qrcode img, #qrcode canvas {
    width: 100% !important;
    height: 100% !important;
    image-rendering: pixelated;
  }

  svg.ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  circle.track {
    fill: none;
    stroke: var(--surface-2);
    stroke-width: 4;
  }

  circle.arc {
    fill: none;
    stroke: var(--mint);
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
  }

  .countdown-label {
    position: absolute;
    bottom: -6%;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(13px, 1.3vw, 16px);
    color: var(--text-muted);
    background: var(--bg);
    padding: 2px 12px;
    border-radius: 20px;
    box-shadow: 0 0 0 1px var(--line);
    white-space: nowrap;
  }

  .countdown-label b {
    color: var(--mint);
    font-weight: 600;
  }

  .gauge-wrap.expired .countdown-label b {
    color: var(--coral);
  }

  .instructions {
    text-align: center;
    max-width: 620px;
  }

  .instructions p {
    margin: 0;
    font-size: clamp(14px, 1.5vw, 18px);
    color: var(--text-muted);
    line-height: 1.5;
  }

  .instructions strong {
    color: var(--text);
    font-weight: 600;
  }

  .footer {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--mint);
  }

  .dot.offline {
    background: var(--coral);
  }

  @media (prefers-reduced-motion: reduce) {
    .qr-card.pulse { animation: none; }
    circle.arc { transition: none; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="eyebrow">ProsthCU · Clinic Check-in</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div class="stage">
    <p class="headline">Scan to check in <span>at the department</span></p>

    <div class="gauge-wrap" id="gaugeWrap">
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="92"></circle>
        <circle class="arc" id="arc" cx="100" cy="100" r="92"
                stroke-dasharray="578" stroke-dashoffset="0"></circle>
      </svg>
      <div class="qr-card" id="qrCard">
        <div id="qrcode"></div>
      </div>
      <div class="countdown-label">refreshes in <b id="secondsLeft">--</b>s</div>
    </div>

    <div class="instructions">
      <p>New here? Scan this code to <strong>register</strong>. Already have an account? Scan it, then log in and <strong>check in</strong>. Codes change every 30 seconds — no need to rush.</p>
    </div>
  </div>

  <div class="footer">
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">connecting…</span>
    </div>
  </div>

<script>
  // ================== CONFIGURATION ==================
  // Paste your deployed Apps Script /exec URL here.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuuIk6qR5iKo2WhmQT3H4h-wIfU45BZV62sRbGrzylD0c6GHoaDcfoEG9tWvHXn1yK/exec';

  // Base URL of the student check-in page (built alongside this file).
  // The QR encodes this URL with the token attached, so scanning it with
  // any phone camera opens the check-in page pre-filled.
  const STUDENT_APP_URL = 'https://REPLACE_WITH_STUDENT_APP_URL/';

  const WINDOW_SECONDS = 30; // must match CONFIG.QR_TOKEN_WINDOW_SECONDS in Apps Script
  // ====================================================

  const ARC_CIRCUMFERENCE = 2 * Math.PI * 92; // matches r="92" in the SVG

  let qrInstance = null;
  let currentToken = null;
  let secondsRemaining = WINDOW_SECONDS;
  let pollFailures = 0;

  function initQr(text) {
    const el = document.getElementById('qrcode');
    el.innerHTML = '';
    qrInstance = new QRCode(el, {
      text: text,
      width: 512,
      height: 512,
      colorDark: '#0e1f1c',
      colorLight: '#f3f7f4',
      correctLevel: QRCode.CorrectLevel.M,
    });
  }

  function updateQr(token) {
    const url = STUDENT_APP_URL + '?qrToken=' + encodeURIComponent(token);
    if (!qrInstance) {
      initQr(url);
    } else {
      qrInstance.clear();
      qrInstance.makeCode(url);
    }
    const card = document.getElementById('qrCard');
    card.classList.remove('pulse');
    void card.offsetWidth; // restart animation
    card.classList.add('pulse');
  }

  function renderRing() {
    const arc = document.getElementById('arc');
    const fraction = Math.max(0, secondsRemaining) / WINDOW_SECONDS;
    arc.style.strokeDashoffset = String(ARC_CIRCUMFERENCE * (1 - fraction));
    document.getElementById('secondsLeft').textContent = Math.max(0, Math.ceil(secondsRemaining));

    const wrap = document.getElementById('gaugeWrap');
    wrap.classList.toggle('expired', secondsRemaining <= 5);
  }

  function setStatus(online) {
    document.getElementById('statusDot').classList.toggle('offline', !online);
    document.getElementById('statusText').textContent = online
      ? 'live · syncing with clinic server'
      : 'connection lost · retrying…';
  }

  async function pollToken() {
    try {
      const res = await fetch(APPS_SCRIPT_URL + '?action=qr', { cache: 'no-store' });
      const data = await res.json();
      if (data && data.token) {
        if (data.token !== currentToken) {
          currentToken = data.token;
          secondsRemaining = data.secondsRemaining;
          updateQr(currentToken);
        } else if (Math.abs(secondsRemaining - data.secondsRemaining) > 2) {
          // Only resync if we drifted significantly
          secondsRemaining = data.secondsRemaining;
        }
        pollFailures = 0;
        setStatus(true);
      }
    } catch (err) {
      pollFailures++;
      if (pollFailures >= 2) setStatus(false);
    }
  }

  function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
  }

  setInterval(() => {
    secondsRemaining -= 1;
    if (secondsRemaining < 0) secondsRemaining = 0;
    renderRing();
    tickClock();
  }, 1000);

  // Use a self-calling timeout to prevent overlapping requests
  async function pollLoop() {
    await pollToken();
    setTimeout(pollLoop, 3000);
  }

  pollLoop();
  tickClock();
  renderRing();
</script>

</body>
</html>
